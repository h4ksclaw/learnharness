[project]
name = "learnharness"
version = "0.1.0"
description = "Domain-agnostic adaptive learning harness — agents that teach, track knowledge, and review."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "asyncpg>=0.30.0",
    "alembic>=1.14.0",
    "pgvector>=0.3.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "fsrs>=4.0.0",
    "openai>=1.0.0",
    "httpx>=0.27.0",
    "instructor>=1.0.0",
    "tiktoken>=0.7.0",
    "apscheduler>=3.10.0",
    "python-dotenv>=1.0.0",
    "beautifulsoup4>=4.12.0",
    "markdownify>=0.14.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.0",
    "ruff>=0.6.0",
    "mypy>=1.13.0",
    "pre-commit>=4.0.0",
    "aiosqlite>=0.20.0",
    "types-beautifulsoup4>=4.12.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM", "C4"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff.lint.per-file-ignores]
"app/engine/knowledge_graph.py" = ["E501"]
"tests/*" = ["E501"]

[tool.ruff.lint.isort]
# One import per line
force-single-line = true

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
disallow_untyped_defs = false
exclude = ["alembic/", "tests/"]

[tool.uv]
dev-dependencies = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.0",
    "ruff>=0.6.0",
    "mypy>=1.13.0",
    "pre-commit>=4.0.0",
    "aiosqlite>=0.20.0",
    "types-beautifulsoup4>=4.12.0",
]
