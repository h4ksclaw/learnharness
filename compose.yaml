services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: learnharness
      POSTGRES_USER: lh
      POSTGRES_PASSWORD: lh_dev
    ports:
      - "5433:5432"
    volumes:
      - lh_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lh -d learnharness"]
      interval: 5s
      timeout: 3s
      retries: 5

  api:
    build: .
    environment:
      DATABASE_URL: postgresql+asyncpg://lh:lh_dev@db:5432/learnharness
      LLM_BASE_URL: http://host.docker.internal:11434/v1
      LLM_MODEL: llama3.2:3b
      LLM_API_KEY: not-needed
      LH_HOST: 0.0.0.0
      LH_PORT: 8000
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

volumes:
  lh_pgdata:
