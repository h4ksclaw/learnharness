repos:
  - repo: local
    hooks:
      - id: gen-openapi-client
        name: Generate OpenAPI client (web)
        entry: bash -c 'cd web && bash scripts/gen-openapi-client.sh || true'
        language: system
        files: ^app/routers/|^app/schemas.py$
        pass_filenames: false

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files
      - id: check-merge-conflict
      - id: debug-statements

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.0
    hooks:
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.13.0
    hooks:
      - id: mypy
        additional_dependencies: ["pydantic>=2.0", "types-beautifulsoup4", "sqlalchemy>=2.0"]
        args: [--ignore-missing-imports]
        exclude: "tests/|alembic/"
