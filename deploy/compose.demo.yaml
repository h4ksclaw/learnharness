# Demo overlay — uses Groq API instead of Ollama, no GPU needed.
# Usage: docker compose -f compose.yaml -f deploy/compose.demo.yaml up -d
#
# This removes the ollama service and points the API at Groq's free API.

services:
  api:
    environment:
      LLM_BASE_URL: ${LLM_BASE_URL:-https://api.groq.com/openai/v1}
      LLM_API_KEY: ${LLM_API_KEY:?Set LLM_API_KEY in .env}
      LLM_MODEL: ${LLM_MODEL:-llama-3.3-70b-versatile}
    # No depends_on ollama needed

  worker:
    environment:
      LLM_BASE_URL: ${LLM_BASE_URL:-https://api.groq.com/openai/v1}
      LLM_API_KEY: ${LLM_API_KEY:?Set LLM_API_KEY in .env}
      LLM_MODEL: ${LLM_MODEL:-llama-3.3-70b-versatile}

  channels:
    environment:
      LLM_BASE_URL: ${LLM_BASE_URL:-https://api.groq.com/openai/v1}
      LLM_API_KEY: ${LLM_API_KEY:?Set LLM_API_KEY in .env}
      LLM_MODEL: ${LLM_MODEL:-llama-3.3-70b-versatile}

  # Remove ollama from the demo stack
  ollama:
    profiles: ["donotstart"]
