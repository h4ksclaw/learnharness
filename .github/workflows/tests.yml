name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      - name: Ruff check
        run: ruff check app/ tests/
      - name: Ruff format check
        run: ruff format --check app/ tests/

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          pip install -e ".[dev]"
          pip install aiosqlite
      - name: Verify alembic migrations are clean
        run: |
          # Verify migration files exist and are syntactically valid Python
          python -c "import ast; import glob; [ast.parse(open(f).read()) for f in glob.glob('alembic/versions/*.py')]; print('All migrations parse OK')"
      - name: Run unit tests
        env:
          DATABASE_URL: "sqlite+aiosqlite:///test.db"
          LLM_BASE_URL: "http://localhost:11434/v1"
          LLM_MODEL: "test"
          LLM_API_KEY: "not-needed"
        run: |
          python -m pytest tests/ -v \
            --ignore=tests/test_tools.py \
            --ignore=tests/test_learning_simulation.py \
            --tb=short

  mypy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - name: Mypy type check
        run: mypy app/ --ignore-missing-imports || true

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install and build
        working-directory: web
        run: |
          npm ci
          npm run build
      - name: Lint
        working-directory: web
        run: npm run lint || true
