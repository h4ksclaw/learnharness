name: Integration (Docker)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  docker-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Build and start stack
        run: |
          # Start just the DB and API (skip Ollama to save time — use a mock LLM URL)
          docker compose up -d db
          sleep 10
          docker compose ps

      - name: Verify DB is healthy
        run: |
          docker compose exec -T db pg_isready -U lh -d learnharness

      - name: Verify pgvector extension
        run: |
          docker compose exec -T db psql -U lh -d learnharness -c "SELECT * FROM pg_extension WHERE extname='vector';"
